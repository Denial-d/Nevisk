<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <meta name="description" content="Невишк — столица республики Тамаш. Интерактивная карта и архив лора.">
  <title>Невишк</title>
  <link rel="icon" href="TemplateData/favicon.png">
  <style>
    @font-face { font-family: "Playfair Display"; src: url("TemplateData/PlayfairDisplay-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #17150F; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #23241F; outline: none; }

    /* Loading screen, in the map's own colours: charcoal, bone, board yellow. */
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #2B2E2C 0%, #17150F 70%);
      color: #E9E3D3; font-family: "PT Sans", "Segoe UI", system-ui, sans-serif; transition: opacity 0.8s ease;
      z-index: 2;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader h1 {
      margin: 0; font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 700;
      font-size: clamp(42px, 8vw, 92px); letter-spacing: 0.28em; padding-left: 0.28em;
    }
    #loader .tag { margin-top: 10px; font-family: "PT Serif", Georgia, serif; font-style: italic; color: #A8A08F; font-size: clamp(14px, 1.6vw, 19px); }
    #loader .bar { margin-top: 44px; width: min(360px, 70vw); height: 2px; background: rgba(233, 227, 211, 0.12); overflow: hidden; }
    #loader .fill { height: 100%; width: 0%; background: #FFDC4A; transition: width 0.25s ease; }
    #loader .status { margin-top: 14px; font-size: 13px; letter-spacing: 0.08em; color: #7D7668; min-height: 1.2em; }
    #loader .fog {
      position: absolute; inset: -20%; pointer-events: none; opacity: 0.35;
      background: radial-gradient(circle at 30% 60%, rgba(150,158,152,0.18), transparent 40%),
                  radial-gradient(circle at 70% 40%, rgba(150,158,152,0.14), transparent 45%);
      animation: drift 18s ease-in-out infinite alternate;
    }
    @keyframes drift { from { transform: translate(-3%, 1%); } to { transform: translate(3%, -1%); } }
    @media (prefers-reduced-motion: reduce) { #loader .fog { animation: none; } #loader, #loader .fill { transition: none; } }

    #warning { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 3; max-width: 90vw;
      font: 14px "PT Sans", system-ui, sans-serif; }
    #warning div { padding: 10px 14px; margin-bottom: 6px; background: #312C23; color: #E9E3D3; border-left: 3px solid #FFDC4A; }
    #warning div.error { border-left-color: #E0533F; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loader">
    <div class="fog"></div>
    <h1>НЕВИШК</h1>
    <div class="tag">Невишк — столица республики Тамаш</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">Загрузка карты…</div>
  </div>
  <div id="warning"></div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loader = document.querySelector("#loader");
    var fill = document.querySelector("#fill");
    var status = document.querySelector("#status");

    function showBanner(msg, type) {
      var box = document.querySelector("#warning");
      var div = document.createElement("div");
      div.textContent = msg;
      if (type === "error") div.className = "error";
      box.appendChild(div);
      if (type !== "error") setTimeout(function () { div.remove(); }, 6000);
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebBuild.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebBuild.data.unityweb",
      frameworkUrl: buildUrl + "/WebBuild.framework.js.unityweb",
      codeUrl: buildUrl + "/WebBuild.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Nevishk",
      productName: "Невишк",
      productVersion: "0.1.0",
      // Sharp on high-DPI screens, but capped: the fog is ray-marched per pixel.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      showBanner: showBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.getElementsByTagName("head")[0].appendChild(meta);
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.25);
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var p = Math.round(progress * 100);
        fill.style.width = p + "%";
        // The last stretch is the city itself being built: terrain, roads, trees, fog.
        status.textContent = p < 90 ? "Загрузка карты… " + p + "%" : "Город строится…";
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;   // used by the page bridge (file picker, links)
        fill.style.width = "100%";
        status.textContent = "";
        requestAnimationFrame(function () { requestAnimationFrame(function () { loader.classList.add("done"); }); });
        setTimeout(function () { loader.remove(); }, 1200);
        canvas.focus();
      }).catch(function (message) {
        status.textContent = "Не удалось запустить карту.";
        showBanner(String(message), "error");
      });
    };
    script.onerror = function () { status.textContent = "Не удалось загрузить карту. Проверьте соединение и обновите страницу."; };
    document.body.appendChild(script);
  </script>
</body>
</html>
