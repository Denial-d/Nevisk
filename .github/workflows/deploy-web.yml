# Builds the Unity project for the web and publishes it on GitHub Pages.
#
# One-time setup (repository Settings):
#   1. Secrets and variables → Actions → New repository secret, three of them:
#        UNITY_EMAIL     the email of your Unity account
#        UNITY_PASSWORD  its password
#        UNITY_LICENSE   the full contents of your Unity license file
#                        (Windows: C:\ProgramData\Unity\Unity_lic.ulf)
#   2. Pages → Build and deployment → Source: GitHub Actions
#
# Runs on every push to main that touches the project, or by hand from the Actions tab.
name: Deploy web map

on:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an older build that hasn't finished.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space for the Unity image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Check out, with LFS files (textures, fonts)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build for WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: auto            # from ProjectSettings/ProjectVersion.txt
          buildMethod: Nevishk.EditorTools.NevishkSetup.BuildWebCI
          buildsPath: build
          buildName: Nevishk
          allowDirtyBuild: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/Nevishk

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
